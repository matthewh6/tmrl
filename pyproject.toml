[project]
name = "tmrl"
version = "0.1.0"
description = "Timestep-Modulated Reinforcement Learning"
requires-python = ">=3.11"
dependencies = [
    "dsrl-openpi",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "stable-baselines3>=2.6.0",
    "tianshou>=0.5.1",
    "ogbench>=1.1.5",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "torchmetrics>=1.8.2",
    "timm>=1.0.19",
    "diffusers>=0.34.0",
    "mujoco>=3.3.4",
    "dm-control>=1.0.31",
    "robosuite==1.4.0",
    "gymnasium>=1.1.1",
    "gym>=0.26.2",
    "h5py>=3.14.0",
    "scipy>=1.15.3",
    "pandas>=2.3.1",
    "pyzmq>=27.1.0",
    "matplotlib>=3.10.0",
    "tensorboard>=2.20.0",
    "moviepy>=2.2.1",
    "imageio-ffmpeg>=0.6.0",
    "plotly>=6.2.0",
    "wandb>=0.19.1",
    "ipdb>=0.13.13",
    "rich>=14.2.0",
    "termcolor>=3.1.0",
    "python-dotenv>=1.1.1",
    "bddl>=3.6.0",
    "lerobot",
    "openpi-client",
    "libero",
    "safetensors==0.4.5",
    "protobuf==6.33.5",
    "pip-system-certs>=5.3",
    "hydra-submitit-launcher>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "pynvml>=12.0.0",
]

[tool.uv.sources]
dsrl-openpi = { path = "dsrl_openpi", editable = true }
openpi-client = { path = "dsrl_openpi/packages/openpi-client", editable = true }
lerobot = { git = "https://github.com/jesbu1/lerobot", rev = "7e0a570b5522b017639caf95472eb660bcd9e1f7" }
libero = { path = "LIBERO_PRO", editable = true }
ogbench = { path = "ogbench", editable = true }

[tool.uv]
override-dependencies = [
    "transformers==4.53.2",
    "jax[cuda12]>=0.5.3,<0.7.0",
    "gymnasium>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["F401"]

[tool.ruff.format]
quote-style = "single"

[tool.hatch.build.targets.wheel]
packages = ["tmrl"]

