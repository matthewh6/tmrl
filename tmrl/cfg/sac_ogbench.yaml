# training
ckpt: null
train_steps: 2_000_000
capacity: ${train_steps}
eval_interval: 50_000
n_envs: 4
n_evals: 25
n_viz: 5
skip_first: false
render_videos: false

# sac
learning_starts: 500
use_offline: false
use_autotune: true
use_success_buffer: false
action_exec_len: 5

# method
method: tmrl
noise_bound: 1.0
context_noise_bound: 1.0
timestep_max: 1.0
actor_action_dim: ${dataset.action_dim}

defaults:
  - base
  - model: sac_ogbench
  - dataset: pointmaze-giant
  - _self_
