# training
ckpt: null
train_steps: 2_000_000
capacity: ${train_steps}
eval_interval: 50_000
save_interval: 50_000
n_envs: 4
n_evals: 25
n_viz: 5
skip_first: False
render_videos: False

# sac
q_lr: 3e-4
policy_lr: 3e-4
learning_starts: 500
use_offline: False
use_autotune: True
use_success_buffer: False
action_exec_len: 5 # open loop action execution length

# method
method: tmrl      # [tmrl, dsrl, spirl, rlpd, rnd]
noise_bound: 1.0
context_noise_bound: 1.0
timestep_max: 1.0
fixed_tcont_context: null  # if set (e.g. 0.5), uses a fixed conditioning timestep instead of learning it
actor_action_dim: ${dataset.action_dim}

defaults:
  - base
  - model: sac_ogbench
  - dataset: pointmaze-giant
  - _self_
