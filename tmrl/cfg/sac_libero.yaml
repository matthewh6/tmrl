# training
ckpt: null
train_steps: 1_000_000
capacity: ${train_steps}
eval_interval: 25_000
skip_first: false
n_envs: 4
n_evals: 20
n_viz: 5
render_videos: true

# sac
learning_starts: 500
use_autotune: true
use_success_buffer: false
action_exec_len: 5

# method
method: tmrl
noise_bound: 1.0
context_noise_bound: 1.0
timestep_max: 1.0
actor_action_dim: 32

# libero/libero-pro
num_steps_wait: 25
perturbation: null # libero-pro perturbations [env, swap, object, lan, task]

defaults:
  - base
  - model: sac_libero
  - dataset: libero_90
  - _self_